name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        # ubuntu-latest is Ubuntu 26.04, which setup-python has no 3.9 for:
        # run 3.9 on 24.04 instead.
        exclude:
          - os: ubuntu-latest
            python-version: '3.9'
        include:
          - os: ubuntu-24.04
            python-version: '3.9'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel pybind11 numpy pytest
        # Cloud API deps so tests/test_api_records.py actually runs instead of
        # being skipped. Those tests guard the endpoint-agreement invariant that
        # a production incident traced back to (see that file's docstring).
        pip install fastapi httpx python-multipart
        # langgraph so tests/test_langgraph_store.py runs instead of skipping —
        # it is the adapter that puts Feather inside an agent, so it must not rot.
        # 3.9 is excluded: langgraph requires >=3.10.
        # langgraph + mcp on 3.10+: both require >=3.10, and both adapters must
        # not rot — the previous MCP server broke silently against SDK 2.0.
        if [ "${{ matrix.python-version }}" != "3.9" ]; then pip install langgraph "mcp>=2.0.0"; fi
        # orjson: the API's fast response path; uvicorn: tests/test_gateway.py
        # starts real API shards behind the gateway.
        pip install orjson uvicorn msgspec

    - name: Build C++ extension
      run: python setup.py build_ext --inplace

    - name: Smoke-test the compiled core
      run: |
        python - <<'EOF'
        import glob, importlib.util, numpy as np
        so = sorted(glob.glob("feather_db/core*.so"))[0]
        spec = importlib.util.spec_from_file_location("core", so)
        core = importlib.util.module_from_spec(spec); spec.loader.exec_module(core)
        db = core.DB.open("smoke.feather", dim=8)
        db.add(id=1, vec=np.random.rand(8).astype(np.float32))
        r = db.search(np.random.rand(8).astype(np.float32), k=1)
        assert r[0].id == 1, r
        print("✓ core import + add + search OK")
        import os, glob
        for f in glob.glob("smoke.feather*"): os.remove(f)
        EOF

    # The tests/ suite (250+ cases: core, graph, filters, BM25/hybrid,
    # extractors, pipelines, concurrency) was never run in CI — only the
    # root-level feature scripts below were. Optional LLM-provider deps are not
    # installed here, so the few tests needing them are deselected.
    # The Rust CLI compiles a VENDORED copy of the engine (cargo package cannot
    # follow paths outside the package root). Left unchecked it drifts: at
    # v0.17.0 it was 764 lines behind and had none of the WAL recovery, fsync,
    # checksum or failed-open fixes, so a published CLI would still lose a bulk
    # import on crash under a version claiming otherwise. Fail the build rather
    # than ship that.
    - name: Vendored C++ is in sync with include/
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        ./scripts/sync-cpp.sh
        git diff --exit-code feather-cli/cpp/ || {
          echo "::error::feather-cli/cpp/ is out of sync — run ./scripts/sync-cpp.sh and commit"
          exit 1
        }

    - name: Run pytest suite
      run: pytest tests -q --deselect tests/test_engine.py::TestProviderInterface::test_provider_str

    # Counts and ratios measured in the same run, so runner speed cancels out:
    # a repeated embed never reaches the provider, an open with text costs
    # about what one without does, RemoteDB keeps one connection.
    - name: Performance gate
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: python benchmarks/perf_gate.py --json perf_gate.json

    # The suite above runs the corruption fuzz on a fixed seed. This runs it
    # deeper on a seed that changes every run, so CI keeps exploring new
    # cases; a failure prints FEATHER_FUZZ_SEED, which reproduces it locally.
    - name: Corruption fuzz (rotating seed)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      env:
        FEATHER_FUZZ_SEED: ${{ github.run_id }}
        FEATHER_FUZZ_CASES: '400'
      run: |
        echo "FEATHER_FUZZ_SEED=$FEATHER_FUZZ_SEED"
        pytest tests/test_corrupt_files.py -q

    - name: MCP suite must run, not skip
      if: matrix.python-version != '3.9'
      # `importorskip` turns a missing/broken SDK into a green skip. That is
      # precisely how the previous MCP server shipped broken against SDK 2.0
      # with CI passing, so on every version that supports it, assert the
      # protocol tests actually executed.
      run: |
        out=$(pytest tests/test_mcp_protocol.py tests/test_mcp_personas.py -q 2>&1 | tail -n 3)
        echo "$out"
        echo "$out" | grep -qE '[0-9]+ passed' || {
          echo "::error::MCP suite did not run on Python ${{ matrix.python-version }}"
          exit 1
        }

    - name: Run feature test suite
      run: |
        set -e
        for t in test_secondary_index test_prefiltered_search test_auto_compact test_quantization test_batch_ingest test_persist_graph; do
          echo "::group::$t"
          python "$t.py"
          echo "::endgroup::"
        done

  # Memory and thread safety of the C++ engine. The suite above checks that a
  # corrupt file gives an error; these check that nothing on the way there
  # reads out of bounds, overflows, races or does undefined arithmetic.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    # High mmap ASLR entropy on current runner kernels breaks the sanitizer
    # runtimes ("unexpected memory mapping").
    - name: Allow sanitizer memory layout
      run: sudo sysctl vm.mmap_rnd_bits=28
    - name: Install build dependencies
      run: pip install setuptools wheel pybind11 numpy pytest
    - name: Build the extension with ASan + UBSan
      env:
        CC: gcc
        CXX: g++
        CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -g -O1
        LDFLAGS: -fsanitize=address,undefined
      run: |
        python setup.py build_ext --inplace
        ldd feather_db/core*.so | grep -q libasan || { echo "::error::extension is not built with ASan"; exit 1; }
    # The tests that load, replay, rewrite and corrupt files (the corruption
    # probes run in children that inherit the sanitizer through LD_PRELOAD).
    # abort_on_error: a report kills the process, which the probes count as a
    # crash; exiting 1 would read as an ordinary refusal.
    - name: File, WAL and engine tests under ASan + UBSan
      env:
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:allocator_may_return_null=1
        UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
        FEATHER_FUZZ_CASES: '200'
      run: |
        export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)"
        pytest -q -p no:cacheprovider tests/test_core.py tests/test_corrupt_files.py \
          tests/test_format_v10.py tests/test_wal_and_lock_edges.py tests/test_wal_durability.py \
          tests/test_wal_recovery.py tests/test_time_index_and_replay.py tests/test_time_travel.py \
          tests/test_erase.py tests/test_versions_batches.py tests/test_open_failure_safety.py \
          tests/test_mmap_readers.py tests/test_int8_refine.py tests/test_native_keys.py \
          tests/test_deleted_graph.py
    - name: Engine under ThreadSanitizer
      env:
        TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 suppressions=tests/cpp/tsan.supp
        STRESS_SECONDS: '20'
      run: |
        g++ -std=c++17 -O1 -g -fsanitize=thread -Iinclude tests/cpp/lock_stress.cpp -o lock_stress -lpthread
        g++ -std=c++17 -O1 -g -fsanitize=thread -Iinclude tests/cpp/engine_stress.cpp \
          src/metadata.cpp src/filter.cpp src/scoring.cpp -o engine_stress -lpthread
        ./lock_stress
        ./engine_stress

  # libFuzzer on the two parsers that read bytes off disk, seeded with every
  # file kind and WAL op the seeded corruption fuzz builds. Coverage-guided,
  # so it reaches what single-byte corruptions do not; a new random seed
  # each run. A crash uploads the input that reproduces it.
  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install build dependencies
      run: |
        pip install setuptools wheel pybind11 numpy pytest
        sudo apt-get install -y -qq clang libclang-rt-dev
    - name: Seed corpus
      run: |
        python setup.py build_ext --inplace
        python tests/fuzz/make_corpus.py fuzz-corpus
    - name: Build fuzz targets
      run: |
        for t in file wal; do
          clang++ -std=c++17 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined -Iinclude \
            tests/fuzz/fuzz_$t.cpp src/metadata.cpp src/filter.cpp src/scoring.cpp -o fuzz_$t -lpthread
        done
    - name: Fuzz the file loader and WAL replay (5 min each, in parallel)
      run: |
        mkdir -p fuzz-artifacts
        opts="-max_total_time=300 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=1024 -print_final_stats=1"
        ./fuzz_file fuzz-corpus/file $opts -artifact_prefix=fuzz-artifacts/file- > fuzz_file.log 2>&1 & a=$!
        FEATHER_FUZZ_BASE=fuzz-corpus/base.feather \
          ./fuzz_wal fuzz-corpus/wal $opts -artifact_prefix=fuzz-artifacts/wal- > fuzz_wal.log 2>&1 & b=$!
        s=0; wait $a || s=1; wait $b || s=1
        tail -n 40 fuzz_file.log fuzz_wal.log
        exit $s
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: fuzz-crashes
        path: |
          fuzz-artifacts/
          fuzz-corpus/base.feather
