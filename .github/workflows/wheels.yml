name: Build & Publish Wheels

# Builds manylinux + macOS binary wheels (and the sdist) with cibuildwheel so
# `pip install feather-db` needs NO C++ compiler, then publishes to PyPI on a
# version tag. Replaces the old publish-pypi.yml, which produced non-manylinux
# Linux wheels that PyPI rejects.
#
# Wheels are built with FEATHER_SIMD=sse: SSE2 is universal on x86-64, so the
# wheels run on any machine (local source builds still default to AVX).
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token stored. One-time
# setup on PyPI: project feather-db → Publishing → add a GitHub publisher with
# owner=feather-store, repo=feather, workflow=wheels.yml, environment=pypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # build (but do NOT publish) on demand

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu → manylinux x86_64; macos-15-intel → x86_64; macos-14 → arm64.
        # macos-13 was RETIRED by GitHub on 2025-12-04: jobs requesting that label
        # queue forever rather than failing, so this workflow never completed and
        # PyPI has never received a binary wheel — every `pip install feather-db`
        # compiles C++ on the user's machine and fails outright without a toolchain.
        os: [ubuntu-latest, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        # v2.21 pinned a manylinux image that has since been removed from quay.io
        # ("No such image: manylinux2014_x86_64:2024.10.07-1"), which failed the
        # Linux leg independently of the macOS one.
        uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *_i686 *-win32"
          # manylinux2014 (glibc 2.17, GCC 9) can no longer install a modern
          # numpy: there is no manylinux2014 wheel for cp312+, so pip falls back
          # to the sdist and the build dies on "NumPy requires GCC >= 10.3".
          # The wheel itself built and repaired fine — only the test venv failed.
          # manylinux_2_28 (glibc 2.28 = Debian 10 / Ubuntu 18.10 / CentOS 8,
          # 2018 and later) ships GCC 12 and is where the ecosystem has moved.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ARCHS_LINUX: "x86_64"
          # setup.py gates x86 SIMD on platform.machine(), which reports the HOST
          # architecture, not the one cibuildwheel is building FOR. Setting this
          # globally pulled x86 intrinsics into the arm64 build:
          #   immintrin.h:14: "This header is only meant to be used on x86 and x64"
          # Scope it to the x86_64 legs; arm64 relies on -O3 NEON auto-vectorisation.
          CIBW_ENVIRONMENT_LINUX: "FEATHER_SIMD=sse"
          CIBW_ENVIRONMENT_MACOS: "FEATHER_SIMD=${{ matrix.os == 'macos-14' && 'none' || 'sse' }}"
          CIBW_TEST_REQUIRES: "numpy"
          CIBW_TEST_COMMAND: >-
            python -c "import feather_db, numpy as np;
            import feather_db.extractors, feather_db.reason, feather_db.integrations;
            db=feather_db.DB.open('t.feather', dim=8);
            db.add(id=1, vec=np.ones(8, dtype=np.float32));
            assert db.search(np.ones(8, dtype=np.float32), k=1)[0].id == 1;
            print('wheel OK', feather_db.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # only publish on a version tag, never on workflow_dispatch
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # OIDC — Trusted Publishing, no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
