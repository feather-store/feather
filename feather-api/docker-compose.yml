version: "3.9"

services:
  feather-api:
    # Official multi-arch image (linux/amd64 + linux/arm64), published by
    # .github/workflows/docker.yml on every version tag.
    # Pin to a release in production, e.g.
    #   ghcr.io/feather-store/feather-api:0.16.0
    #
    # To build locally from source instead of pulling, uncomment:
    # build:
    #   context: ..            # repo root (so Dockerfile can copy feather source)
    #   dockerfile: feather-api/Dockerfile
    image: ghcr.io/feather-store/feather-api:latest
    ports:
      - "8000:8000"
    volumes:
      - feather-data:/data   # persistent vector store
    environment:
      FEATHER_DATA_DIR: /data
      FEATHER_DB_DIM: "768"
      # REQUIRED. The container refuses to start without it — an unset key
      # would otherwise mean an open vector store on a published port. `?err`
      # (not `:-`) fails the compose run here rather than at container start,
      # so the error names the missing variable. Never commit a real key.
      FEATHER_API_KEY: "${FEATHER_API_KEY:?set FEATHER_API_KEY (e.g. `openssl rand -hex 32`), or set FEATHER_DEV_MODE=1 for a local no-auth run}"
      # Local, unreachable hosts only — skips auth entirely.
      FEATHER_DEV_MODE: "${FEATHER_DEV_MODE:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  feather-data:
    driver: local
