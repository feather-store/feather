version: "3.9"

services:
  feather-api:
    # Official multi-arch image (linux/amd64 + linux/arm64), published by
    # .github/workflows/docker.yml on every version tag.
    # Pin to a release in production, e.g.
    #   ghcr.io/feather-store/feather-api:0.16.0
    #
    # To build locally from source instead of pulling, uncomment:
    # build:
    #   context: ..            # repo root (so Dockerfile can copy feather source)
    #   dockerfile: feather-api/Dockerfile
    image: ghcr.io/feather-store/feather-api:latest
    ports:
      - "8000:8000"
    volumes:
      - feather-data:/data   # persistent vector store
    environment:
      FEATHER_DATA_DIR: /data
      FEATHER_DB_DIM: "768"
      # REQUIRED — set FEATHER_API_KEY in your environment or a .env file.
      # If unset the API starts in dev mode (no auth). Never commit a real key.
      FEATHER_API_KEY: "${FEATHER_API_KEY:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  feather-data:
    driver: local
